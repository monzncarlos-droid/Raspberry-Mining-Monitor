# Raspberry Mining Monitor configuration.
#
# Copy to config.yaml and fill in your own values. config.yaml is gitignored:
# it is the only place addresses belong, and nothing is hard-coded in source.

miners:
  - name: NerdOctaxe
    host: 192.168.1.51          # IP or hostname of the miner's AxeOS web UI
    type: axeos
    payout_address: bc1qYOUR_NERDOCTAXE_ADDRESS
    interval: 2s
    timeout: 2s
    # Both AxeOS variants trigger thermal protection at 70 C, so red sits on
    # that line and amber gives six degrees of warning first. A NerdOctaxe
    # idling at 62 to 63 C stays green. Adjustable at runtime on /settings.
    warn_temp_c: 64          # amber at or above this
    crit_temp_c: 70          # red at or above this

  - name: Gamma 602
    host: 192.168.1.52
    type: axeos
    payout_address: bc1qYOUR_GAMMA_ADDRESS
    interval: 2s
    timeout: 2s
    # Optional: force this miner's pool provider instead of auto-detecting it.
    # pool_provider: ckpool   # publicpool | ckpool | braiins | btcpowlab | generic | auto

  # A miner behind the LAN monitoring security contract (e.g. the Mac metal
  # miner) requires a Bearer token. It is sent as "Authorization: Bearer TOKEN"
  # and is never shown in the UI. Keep it on a trusted network: the exporter is
  # plain HTTP, so the token is not encrypted in transit.
  # - name: MacBook M2
  #   host: 192.168.1.70:9110
  #   type: axeos
  #   payout_address: bc1qYOUR_MAC_ADDRESS
  #   token: YOUR_32_TO_128_CHAR_URL_SAFE_TOKEN

# Bitcoin network data. provider: public | core | demo
# base_url can point at a self-hosted mempool instance or a mirror.
bitcoin:
  provider: public
  base_url: https://mempool.space
  interval: 30s
  timeout: 8s

# Solo pool statistics. Provider-agnostic: each miner is routed to a provider by
# its stratum host, or by an explicit override.
#
# provider: the default for miners without their own pool_provider override.
#   auto        detect per miner from the stratum host (recommended for a mixed
#               fleet); unknown pools fall back to "generic"
#   publicpool  public-pool.io
#   ckpool      solo.ckpool.org (and regional mirrors)
#   braiins     Braiins Pool (needs a token, see below)
#   btcpowlab   BTC PoW Lab Hybrid Solo
#   generic     derive stats from each miner's own telemetry, no external API
#   none        no pool panel
#   demo        simulated
# base_url applies to Public Pool (ckpool and braiins use their own defaults).
# token is only for Braiins; it stays in this file and is never sent to the UI.
pool:
  provider: auto
  base_url: https://public-pool.io:40557
  token: ""
  interval: 60s
  timeout: 8s

dashboard:
  bind: 0.0.0.0                 # set to 127.0.0.1 to keep it off the LAN
  port: 8080
  admin_bind: 127.0.0.1         # health endpoint stays on loopback

  # /settings and /healthz answer only to requests from this machine, which on
  # the Pi means the kiosk itself. Set to false if this service is ever placed
  # behind a reverse proxy: X-Forwarded-For is deliberately not trusted, so
  # every proxied request would otherwise look local.
  settings: true
  settings_path: /var/lib/rmm/thresholds.json

  # Expose GET /metrics in Prometheus format, gated to the local network.
  metrics: true

  # Burn-in screensaver: after this many idle minutes the kiosk shows a single
  # floating panel (fleet total + key network figures) drifting across a black
  # screen. 0 disables it.
  screensaver_minutes: 15

# Rolling fleet history (1h/24h/7d) is kept in RAM and persisted next to the
# settings file (miners.json, thresholds.json, history.gob live in that dir).
# Miners and provider URLs below seed the first run; after that they are edited
# live on the admin page and stored in miners.json.
# Opt-in operator alerts. Everything stays off unless webhook_url is set. The
# URL is a secret kept in this file only; it is never exposed by the API or UI.
# Alerts POST a small JSON body (works with ntfy, or a Slack/Discord webhook
# wrapper). Delivery is outbound only, to exactly this URL.
alerts:
  webhook_url: ""          # e.g. https://ntfy.sh/your-private-topic
  offline_minutes: 10      # alert when a miner is offline this long (0 = off)
  temp_alerts: true        # alert when ASIC temperature reaches its critical level
  cooldown_minutes: 30     # minimum gap between repeats of the same alert

history:
  enabled: true
  retention_days: 7

# Optional: push the fleet metrics to a Prometheus remote_write endpoint such as
# Grafana Cloud, so you can watch the fleet from anywhere. Outbound only: the
# miners and this monitor are never exposed. Off unless enabled. The token is a
# secret; keep it in token_file with 0600 permissions rather than inline. See
# docs/GRAFANA.md for the full walkthrough and a dashboard to import.
grafana:
  enabled: false
  url: ""                          # e.g. https://prometheus-prod-65-prod-eu-west-2.grafana.net/api/prom/push
  user: ""                         # Grafana Cloud instance / username (a number)
  token_file: /etc/rmm/grafana.token   # file containing only the API token
  # token: ""                      # alternative to token_file (less safe)
  interval: 30s
  timeout: 10s
